# fly.toml app configuration file generated for local-lens on 2026-06-08T05:13:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'local-lens'
primary_region = 'sin'

[build]

[env]
  LL_MODE = 'production'
  PORT = '8080'

[[mounts]]
  source = 'locallens_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
